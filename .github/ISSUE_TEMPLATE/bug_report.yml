name: "🐛 Bug Report"
description: "Something isn't working as expected"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please fill in every section — incomplete reports will be closed.

  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      placeholder: "A clear description of the bug."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Create a workflow with...
        2. Run `cognipipe run workflow.yaml`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: "Your workflow.yaml (if applicable)"
      render: yaml

  - type: textarea
    id: error
    attributes:
      label: "Error output / stack trace"
      render: shell

  - type: dropdown
    id: node-version
    attributes:
      label: "Node.js version"
      options: ["22.x", "20.x", "18.x", "Other"]
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating system"
      options: ["macOS", "Ubuntu/Debian", "Windows", "Other Linux", "Other"]
    validations:
      required: true

  - type: input
    id: cognipipe-version
    attributes:
      label: "@cognipipe/core version"
      placeholder: "e.g. 0.3.1"
    validations:
      required: true
