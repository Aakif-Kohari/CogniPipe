# .github/workflows/check-assignments.yml
name: '⏰ Enforce 48-Hour Assignment Rule'

on:
  schedule:
    # Runs every hour — fine-grained enough for the 36h/48h windows
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow maintainer to trigger manually for testing

permissions:
  issues: write

jobs:
  enforce-deadline:
    name: Check all assigned issues for deadline compliance
    runs-on: ubuntu-latest

    steps:
      - name: Run deadline enforcement logic
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const now   = new Date();

            // ── Helper: hours between two dates ──────────────────────────
            function hoursBetween(a, b) {
              return (b - a) / (1000 * 60 * 60);
            }

            const EXTENSION_HOURS = 24;

            // ── Step 1: Fetch all open issues labelled 'assigned' ───────────
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state:    'open',
              labels:   'assigned',
              per_page: 100,
            });

            console.log(`🔍 Found ${issues.length} issue(s) with 'assigned' label.`);

            for (const issue of issues) {
              // Skip pull requests (GitHub API returns PRs in issues endpoint)
              if (issue.pull_request) continue;

              const issueNum  = issue.number;
              const assignees = issue.assignees.map(a => a.login);

              console.log(`\n── Issue #${issueNum}: assignees = [${assignees.join(', ')}]`);

              // If label is orphaned (no actual assignee), clean up
              if (assignees.length === 0) {
                console.log(`  ⚠️  No assignees — removing stale 'assigned' label`);
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: issueNum, name: 'assigned',
                  });
                } catch (e) { /* label may already be gone */ }
                continue;
              }

              // ── Step 2: Read all comments to find our machine-readable data ─
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issueNum,
                per_page: 100,
              });

              let assignedAt               = null;
              let assignee                 = null;
              let warningPostedForDeadline = null; // deadline ISO the last warning targeted
              let lastExtensionGrantedAt   = null; // ISO, from our own bot-posted marker
              let extensionAlreadyGranted  = false;
              let pendingExtensionRequest  = null; // { requester } — not yet acknowledged

              for (const c of comments) {
                const body = c.body || '';

                const isOurBot = c.user?.type === 'Bot' && c.user?.login === 'github-actions[bot]';
                const assignMatch = body.match(
                  /<!-- COGNIPIPE_ASSIGNED_AT:(.+?)\|ASSIGNEE:(.+?) -->/
                );
                if (isOurBot && assignMatch) {
                  assignedAt = assignMatch[1].trim();
                  assignee   = assignMatch[2].trim();
                  // New assignment cycle: drop any state carried over from a prior assignee
                  warningPostedForDeadline = null;
                  lastExtensionGrantedAt   = null;
                  extensionAlreadyGranted  = false;
                  pendingExtensionRequest  = null;
                }

                const warningMatch = isOurBot && body.match(/<!-- COGNIPIPE_36H_WARNING:(.+?) -->/);
                if (warningMatch && !Number.isNaN(Date.parse(warningMatch[1].trim()))) {
                  warningPostedForDeadline = warningMatch[1].trim();
                }

                // Our own extension-grant marker — bot-posted, not the raw ask
                const grantMatch = isOurBot && body.match(/<!-- COGNIPIPE_EXTENSION_GRANTED:(.+?) -->/);
                if (grantMatch && !Number.isNaN(Date.parse(grantMatch[1].trim()))) {
                  lastExtensionGrantedAt  = grantMatch[1].trim();
                  extensionAlreadyGranted = true;
                  pendingExtensionRequest = null; // this bot reply resolves any earlier request
                }

                // Our own escalation reply also resolves the pending request
                if (isOurBot && body.includes('<!-- COGNIPIPE_SECOND_EXTENSION_FLAGGED -->')) {
                  pendingExtensionRequest = null;
                }

                // Detect a fresh, not-yet-handled extension request from the assignee
                if (assignees.includes(c.user.login) && c.user.type !== 'Bot') {
                  const bodyLower = body.toLowerCase();
                  const extensionKeywords = [
                    'extension', 'extend', 'more time', 'need more',
                    'extra time', 'few more', 'bit more', 'still working',
                    'still on it', 'please extend',
                  ];
                  if (extensionKeywords.some(kw => bodyLower.includes(kw))) {
                    pendingExtensionRequest = { requester: c.user.login };
                  }
                }
              }

              if (!assignedAt || !assignee) {
                console.log(`  ⚠️  No COGNIPIPE_ASSIGNED_AT marker found — skipping.`);
                continue;
              }

              // ── Step 3: Check if a PR has been linked ──────────────────────
              const { data: timeline } = await github.rest.issues.listEventsForTimeline({
                owner,
                repo,
                issue_number: issueNum,
                per_page: 100,
              });

              const hasPRLinked = timeline.some(
                ev =>
                  ev.event === 'cross-referenced' &&
                  ev.source?.issue?.pull_request != null
              );

              if (hasPRLinked) {
                console.log(`  ✅ PR linked — no action needed.`);
                continue;
              }

              // ── Step 4: Acknowledge a fresh extension request, visibly ──────
              if (pendingExtensionRequest) {
                if (!extensionAlreadyGranted) {
                  const grantedAt      = now.toISOString();
                  const baseDeadlineMs = new Date(assignedAt).getTime() + 48 * 60 * 60 * 1000;
                  const extDeadlineMs  = now.getTime() + EXTENSION_HOURS * 60 * 60 * 1000;
                  const newDeadline    = new Date(Math.max(baseDeadlineMs, extDeadlineMs));

                  console.log(`  ✅ Granting ${EXTENSION_HOURS}h extension requested by @${pendingExtensionRequest.requester}`);

                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNum,
                    body: [
                      `<!-- COGNIPIPE_EXTENSION_GRANTED:${grantedAt} -->`,
                      ``,
                      `✅ **Extension granted, @${pendingExtensionRequest.requester}!**`,
                      ``,
                      `You now have until **${newDeadline.toUTCString()}** (about ${EXTENSION_HOURS} more hours from now) before this issue would be automatically unassigned.`,
                      ``,
                      `This is a one-time automatic extension per assignment. If you need more time after this, reply here again — I'll flag it for a maintainer to look at directly rather than guessing.`,
                      ``,
                      `> *Automated reply by CogniPipeBot.*`,
                    ].join(`\n`),
                  });

                  lastExtensionGrantedAt  = grantedAt;
                  extensionAlreadyGranted = true;
                } else {
                  console.log(`  ℹ️  @${pendingExtensionRequest.requester} asked again after already receiving one automatic extension — flagging for maintainer.`);

                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNum,
                    body: [
                      `<!-- COGNIPIPE_SECOND_EXTENSION_FLAGGED -->`,
                      ``,
                      `👋 @${pendingExtensionRequest.requester} — this issue already received one automatic extension, so I can't grant a second one on my own.`,
                      ``,
                      `I've flagged this thread for @${owner} to take a look directly — hang tight!`,
                      ``,
                      `> *Automated reply by CogniPipeBot.*`,
                    ].join(`\n`),
                  });
                }
              }

              // ── Step 5: Compute the effective deadline for this cycle ───────
              const baseDeadlineMs = new Date(assignedAt).getTime() + 48 * 60 * 60 * 1000;
              const extDeadlineMs  = lastExtensionGrantedAt
                ? new Date(lastExtensionGrantedAt).getTime() + EXTENSION_HOURS * 60 * 60 * 1000
                : -Infinity;
              const deadlineAt = new Date(Math.max(baseDeadlineMs, extDeadlineMs));
              const hoursRemaining = hoursBetween(now, deadlineAt);
              console.log(`  ⏱  ${hoursRemaining.toFixed(2)}h remaining until deadline (${deadlineAt.toISOString()}) for @${assignee}`);

              // ── Step 6: Apply enforcement actions ─────────────────────────

              if (hoursRemaining <= 0) {
                console.log(`  🔴 Deadline reached — unassigning @${assignee}`);

                await github.rest.issues.removeAssignees({
                  owner, repo, issue_number: issueNum, assignees: [assignee],
                });

                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: issueNum, name: 'assigned',
                  });
                } catch (e) { /* label may already be gone */ }

                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNum,
                  body: [
                    `<!-- COGNIPIPE_UNASSIGNED -->`,
                    ``,
                    `⏰ **Deadline reached.**`,
                    ``,
                    `@${assignee} has been automatically **unassigned** from this issue. No commit or Draft PR was linked in time${extensionAlreadyGranted ? ', even with the automatic extension already applied' : ''}.`,
                    ``,
                    `🔓 This issue is now **open for anyone to claim!**`,
                    `Comment \`.take\` or \`!assign\` below to get started.`,
                    ``,
                    `No hard feelings — life happens! Check out other [open issues](../../issues?q=is%3Aissue+is%3Aopen+no%3Aassignee) and jump back in anytime. 💙`,
                    ``,
                    `> *Automated action by CogniPipeBot.*`,
                  ].join(`\n`),
                });

              } else if (hoursRemaining <= 12 && warningPostedForDeadline !== deadlineAt.toISOString()) {
                console.log(`  🟡 12h-before-deadline mark reached — posting warning to @${assignee}`);

                const remainingHours = Math.ceil(hoursRemaining);

                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNum,
                  body: [
                    `<!-- COGNIPIPE_36H_WARNING:${deadlineAt.toISOString()} -->`,
                    ``,
                    `⚠️ **Heads-up, @${assignee}!**`,
                    ``,
                    `You have approximately **${remainingHours} hour(s) remaining** before this issue is automatically unassigned.`,
                    ``,
                    `To keep your assignment, do **one** of the following:`,
                    `1. 📬 Open a **Draft PR** referencing \`Closes #${issueNum}\` `,
                    `2. 💾 Push a **commit** mentioning \`#${issueNum}\` in the message`,
                    `3. 💬 Reply here with **"I need an extension"** — we're happy to accommodate!`,
                    ``,
                    `No response = auto-unassignment when the deadline hits. 🤖`,
                    ``,
                    `> *Automated reminder by CogniPipeBot.*`,
                  ].join(`\n`),
                });

              } else {
                console.log(`  🟢 ${hoursRemaining.toFixed(1)}h remaining — within limits.`);
              }
            }

            console.log('\n✅ Deadline enforcement complete.');
