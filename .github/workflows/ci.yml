# .github/workflows/ci.yml
name: '✅ CI — Lint, Type Check & Tests'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'

jobs:
  # ── Job 1: Lint & Format ───────────────────────────────────────────────────
  lint:
    name: '🔍 Lint & Format Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for Turborepo affected detection

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: Run ESLint
        run: |
          if find . -name "*.ts" -not -path "*/node_modules/*" -not -path "*/dist/*" | grep -q .; then
            pnpm exec eslint . --max-warnings=100
          else
            echo "⏭️  No TypeScript files yet — skipping ESLint"
          fi

  # ── Job 2: TypeScript Type Check ───────────────────────────────────────────
  type-check:
    name: '🏷️ TypeScript Type Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: |
          echo "Scanning for packages with tsconfig.json..."
          FOUND=0
          for tsconfig in packages/*/tsconfig.json nodes/*/tsconfig.json; do
            [ -f "$tsconfig" ] || continue
            dir=$(dirname "$tsconfig")
            src_files=$(find "$dir/src" -name "*.ts" 2>/dev/null | wc -l)
            if [ "$src_files" -gt "0" ]; then
              echo "Checking $dir..."
              (cd "$dir" && pnpm exec tsc --noEmit) && echo "✅ $dir passed" || echo "❌ $dir failed"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq "0" ]; then
            echo "⏭️  No packages with source files found yet — skipping"
          fi

  # ── Job 3: Tests ───────────────────────────────────────────────────────────
  test:
    name: '🧪 Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          TEST_FILES=$(find . -name "*.test.ts" \
            -not -path "*/node_modules/*" \
            -not -path "*/node-template/*" \
            | wc -l)
          if [ "$TEST_FILES" -gt "0" ]; then
            pnpm test
          else
            echo "⏭️  No test files found yet — skipping"
          fi

  # ── Job 4: Build Verification ──────────────────────────────────────────────
  build:
    name: '🏗️ Build Verification'
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          TS_FILES=$(find packages nodes -name "*.ts" \
            -not -name "*.d.ts" \
            -not -path "*/node_modules/*" \
            -not -path "*/__tests__/*" \
            -not -path "*/dist/*" 2>/dev/null | wc -l)
          if [ "$TS_FILES" -gt "0" ]; then
            echo "Found $TS_FILES source files — running build..."
            pnpm turbo build
          else
            echo "⏭️  No source files found yet — skipping build"
          fi

      - name: Verify build artifacts
        run: |
          if find packages nodes -name "dist" -type d \
              -not -path "*/node_modules/*" 2>/dev/null | grep -q .; then
            echo "✅ Build artifacts found:"
            find packages nodes -name "dist" -type d \
              -not -path "*/node_modules/*"
          else
            echo "⏭️  No dist/ artifacts yet — will be enforced once source code is added"
          fi

  # ── Job 5: Node API Compliance ─────────────────────────────────────────────
  node-compliance:
    name: '🔌 Node API Compliance'
    runs-on: ubuntu-latest
    needs: [build]
    # Only runs on PRs that add/modify a node package
    if: |
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.title, 'node-') ||
       contains(github.event.pull_request.title, 'Node'))
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Validate nodes extend BaseNode correctly
        run: |
          NODE_DIRS=$(find nodes -name "dist" -type d \
            -not -path "*/node_modules/*" 2>/dev/null)
          if [ -z "$NODE_DIRS" ]; then
            echo "⏭️  No built node packages found — skipping compliance check"
            exit 0
          fi
          # Uses import() not require() — compatible with "type": "module"
          for dir in $NODE_DIRS; do
            node_dir=$(dirname "$dir")
            echo "Checking $node_dir..."
            node --input-type=module << EOF
              import { readFileSync } from 'fs';
              const pkg = JSON.parse(readFileSync('${node_dir}/package.json', 'utf8'));
              const mod = await import('./${node_dir}/dist/index.js');
              const exports = Object.values(mod);
              console.log('✅ ' + pkg.name + ': ' + exports.length + ' export(s) found');
          EOF
          done
