# .github/workflows/ci.yml
name: "✅ CI — Lint, Type Check & Tests"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  push:
    branches: [main]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ── Job 1: Lint & Format ───────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Needed for Turborepo affected detection

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm turbo lint

      - name: Check Prettier formatting
        run: pnpm format:check

  # ── Job 2: TypeScript Type Check ───────────────────────────────────────────
  type-check:
    name: "🏷️ TypeScript Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build dependency packages first
        run: pnpm turbo build --filter=@cognipipe/types --filter=@cognipipe/sdk

      - name: Run TypeScript compiler check
        run: pnpm turbo type-check

  # ── Job 3: Tests (matrix across Node versions) ─────────────────────────────
  test:
    name: "🧪 Tests (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm turbo build --filter=@cognipipe/types --filter=@cognipipe/sdk

      - name: Run tests with coverage
        run: pnpm turbo test -- --coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20' && github.event_name == 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.node-version }}
          fail_ci_if_error: false

  # ── Job 4: Build Verification ──────────────────────────────────────────────
  build:
    name: "🏗️ Build Verification"
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build all affected packages
        run: pnpm turbo build

      - name: Check bundle artifacts exist
        run: |
          echo "Checking dist/ outputs..."
          ls packages/core/dist/
          ls packages/sdk/dist/
          ls packages/types/dist/
          echo "✅ All build artifacts present"

  # ── Job 5: Node API Compliance Check ──────────────────────────────────────
  node-compliance:
    name: "🔌 Node API Compliance"
    runs-on: ubuntu-latest
    needs: [build]
    if: contains(github.event.pull_request.title, 'node') || contains(github.event.pull_request.title, 'Node')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate all nodes extend BaseNode correctly
        run: |
          pnpm --filter "./nodes/*" exec node -e "
          const pkg = require('./package.json');
          const main = require('./dist/index.js');
          const { BaseNode } = require('@cognipipe/sdk');
          const nodes = Object.values(main).filter(v => v.prototype instanceof BaseNode);
          if (nodes.length === 0) throw new Error('No valid BaseNode exports found in ' + pkg.name);
          console.log('✅ ' + pkg.name + ': ' + nodes.length + ' valid node(s)');
          "