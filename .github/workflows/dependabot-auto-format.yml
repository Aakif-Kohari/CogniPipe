# .github/workflows/dependabot-auto-format.yml
name: '🎨 Auto-format Dependabot PRs'

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  format:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.DEPENDABOT_FORMAT_PAT }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'chore: auto-format dependabot PR'
          commit_user_name: 'cognipipe-bot'
