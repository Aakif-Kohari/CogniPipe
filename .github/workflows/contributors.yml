# .github/workflows/contributors.yml
name: Update Contributors in README

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday at 3 AM UTC
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: read

concurrency:
  group: contributors-readme
  cancel-in-progress: false

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    name: Automate contributors list
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f # v2.3.11
        with:
          image_size: 80
          columns_per_row: 6
          commit_message: 'docs(readme): update contributors list [skip ci]'
          pr_title_on_protected: 'docs(readme): update contributors list'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
